<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --blue:#1a5fb4; --blue-l:#dbe8fb; --gray:#e4e4e4; --line:#d6d6d6; --text:#222; --muted:#666; --green:#e3f4e1; --red:#b3261e; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; color: var(--text); background: #f7f7f7; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; }
  h1 { font-size: 18px; margin: 0; }
  h3 { margin: 0 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  a { color: var(--blue); }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .tab.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn { border: 1px solid var(--line); background: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn.danger { color: var(--red); border-color: #e6b3ae; }
  .lang { border: 1px solid var(--line); background: #fff; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--blue); }
  .nav { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  select, input { font-size: 15px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #ececec; border-right: 1px solid #ececec; padding: 0; text-align: center; font-size: 13px; }
  th { background: #f2f2f2; padding: 8px 10px; white-space: nowrap; }
  .time { position: sticky; left: 0; background: #f7f7f7; padding: 6px 10px; white-space: nowrap; text-align: left; z-index: 1; font-variant-numeric: tabular-nums; }
  td .c { display: block; min-width: 84px; padding: 9px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; margin: 0 auto; }
  .free { cursor: pointer; }
  .free:hover { background: var(--green); }
  .mine { background: var(--blue-l); color: var(--blue); cursor: pointer; font-weight: 600; }
  .taken { background: var(--gray); color: var(--muted); }
  .taken.admin { cursor: pointer; }
  .past { background: repeating-linear-gradient(45deg, #f1f1f1, #f1f1f1 4px, #fafafa 4px, #fafafa 8px); }
  .off { background: #d9d9d9; }
  .blocked { background: repeating-linear-gradient(45deg, #f6dcd9, #f6dcd9 5px, #fbeceb 5px, #fbeceb 10px); color: var(--red); }
  .c.admin { cursor: pointer; }
  .form label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 3px; }
  .form input, .form select { width: 100%; }
  .form .two { display: flex; gap: 8px; }
  .form .two > div { flex: 1; }
  .form .chk { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: 14px; }
  .form .chk input { width: auto; }
  /* Settings page */
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .panel h3 { font-size: 16px; }
  .panel .help { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .panel label.f { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 3px; }
  .panel .sub { display: block; font-weight: normal; color: var(--muted); font-size: 12px; }
  .panel input[type=text], .panel input[type=email], .panel input[type=number] { width: 100%; max-width: 420px; }
  .panel input.short { max-width: 110px; }
  .panel .unit { margin-left: 6px; color: var(--muted); font-size: 14px; }
  .panel table.hours { width: auto; border-collapse: collapse; margin-top: 4px; }
  .panel table.hours th, .panel table.hours td { border: 0; padding: 4px 10px 4px 0; text-align: left; font-size: 14px; background: none; }
  .panel table.hours th { font-weight: normal; color: var(--muted); font-size: 12px; }
  .panel table.hours td.dn { font-weight: 600; min-width: 80px; }
  .panel table.hours input[type=time] { padding: 5px 6px; }
  .panel table.hours input[type=checkbox] { width: 18px; height: 18px; }
  .panel table.hours tr.closed td.dn { color: #aaa; }
  .comp { border: 1px solid #ececec; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
  .comp .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .comp .sw { display: flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; }
  .comp .sw input { width: 18px; height: 18px; }
  .comp.offc { background: #f4f4f4; }
  .comp details { margin-top: 6px; font-size: 14px; }
  .comp summary { cursor: pointer; color: var(--blue); font-size: 13px; }
  .arow { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  .logtbl td, .logtbl th { text-align: left; padding: 5px 8px; font-size: 12px; white-space: normal; }
  th .swh { display: block; white-space: normal; font-weight: normal; font-size: 11px; color: var(--muted); max-width: 130px; margin: 2px auto 0; }
  .comp .tools { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .btn.sm { padding: 3px 9px; font-size: 13px; }
  .comp .soft { display: block; font-weight: normal; font-size: 13px; color: var(--muted); }
  th.offh { background: #e0e0e0; color: #999; }
  /* 4-week calendar: one row per week */
  .cal { display: grid; gap: 6px; margin-bottom: 16px; }
  .cal .dh { font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 2px; }
  .cday { position: relative; font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 6px 4px 8px; cursor: pointer; text-align: center; min-width: 0; color: var(--text); }
  .cday:hover { border-color: var(--blue); }
  .cday .n { font-size: 16px; font-weight: 600; }
  .cday .m { font-size: 11px; color: var(--muted); }
  .cday .cnt { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cday .bar { display: block; height: 4px; border-radius: 2px; background: #eee; margin: 4px 6px 0; overflow: hidden; }
  .cday .bar b { display: block; height: 100%; background: #5aa65a; }
  .cday.full .cnt { color: var(--red); }
  .cday.sel { border-color: var(--blue); box-shadow: inset 0 0 0 2px var(--blue); background: var(--blue-l); }
  .cday.past { background: #f1f1f1; color: #aaa; cursor: default; border-color: #ececec; }
  .cday.past .m { color: #bbb; }
  .cday .dot { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
  .day-title { margin: 4px 0 8px; font-size: 16px; }
  .foot { font-size: 13px; margin: 8px 0 0; }
  .warn { background: #fff1c9; padding: 8px 10px; border-radius: 6px; font-size: 14px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
  .card .actions { display: flex; gap: 6px; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #eee; margin-top: 4px; }
  .badge.Confirmed { background: var(--green); }
  .badge.Awaiting { background: #fff1c9; }
  .msg { padding: 10px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }
  .msg.ok { background: var(--green); }
  .msg.err { background: #fde7e5; color: var(--red); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal { background: #fff; border-radius: 10px; padding: 18px; max-width: 380px; width: 100%; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .login { max-width: 380px; margin: 60px auto; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
  .login-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .login input, .login .btn { width: 100%; }
  .rules { margin-top: 12px; }
</style>
</head>

    fFor: ['Pour', 'For'],
    forSelf: ['Moi-même', 'Myself'],
    forOther: ['Une autre personne', 'Someone else'],
    forBlock: ['Blocage (fermeture, entretien…)', 'Block (closure, maintenance…)'],
    fEmail: ['Courriel de la personne', 'Their email'],
    fNote: ['Note (facultatif, visible des admins seulement)', 'Note (optional, admins only)'],
    fLabel: ['Libellé affiché à tous (p. ex. Entretien)', 'Label everyone sees (e.g. Maintenance)'],
    fNotify: ['Aviser la personne par courriel', 'Email the person about it'],
    save: ['Enregistrer', 'Save'],
    everyComputer: ['Tous les ordinateurs', 'All computers'],
    offShort: ['indisponible', 'unavailable'],
    endBeforeStart: ['L\'heure de fin doit suivre l\'heure de début.', 'The end time must be after the start time.'],
    adminBookHint: ['Les réservations faites par un admin sont confirmées d\'office (aucun courriel de confirmation).', 'Bookings made by an admin are confirmed right away (no confirmation emails).'],

    settings: ['Réglages (admin)', 'Settings (admin)'],
    sComputers: ['Ordinateurs', 'Computers'],
    sComputersHelp: ['Décochez « Réservable » pour retirer un ordinateur des réservations (il reste affiché, en gris). Le changement est enregistré tout de suite. Les réservations déjà faites ne sont pas annulées.',
      'Untick "Bookable" to take a computer out of booking (it stays on the page, greyed out). The change is saved right away. Existing bookings are not cancelled.'],
    sBookable: ['Réservable', 'Bookable'],
    sNotesEdit: ['Modifier le nom, la RAM, les logiciels et les notes', 'Edit name, RAM, software and notes'],
    sName: ['Nom', 'Name'],
    sNameHelp: ['Les réservations de cet ordinateur suivent automatiquement le nouveau nom.', 'Its bookings follow the new name automatically.'],
    sSoftware: ['Logiciels', 'Software'],
    sSoftwareHelp: ['Séparés par des virgules, p. ex. SPSS, Stata, R. Affichés sous le nom; les chercheurs peuvent filtrer par logiciel.',
      'Comma-separated, e.g. SPSS, Stata, R. Shown under the name; researchers can filter by software.'],

    sDelete: ['Supprimer cet ordinateur', 'Delete this computer'],
    sAskDelete: ['Supprimer {0} de la liste? Ses réservations passées restent dans la feuille de calcul.', 'Delete {0} from the list? Its past bookings stay in the spreadsheet.'],

    sEmailsHelp: ['Avant chaque réservation, la personne reçoit un courriel lui demandant de confirmer. Sans confirmation à temps, la réservation est annulée et la plage libérée.',

    sReminder1: ['Envoyer le courriel de confirmation', 'Send the confirmation email'],
    sReminder2: ['Deuxième rappel (facultatif)', 'Second reminder (optional)'],
    sReminder2Help: ['Envoyé seulement si la réservation n\'est toujours pas confirmée. Laissez vide pour aucun deuxième rappel.', 'Sent only if the booking is still unconfirmed. Leave blank for no second reminder.'],

    sWeeksUnit: ['semaine(s)', 'week(s)'],

    sSlotsUnit: ['plage(s)', 'slot(s)'],
    sMaxUpcoming: ['Réservations à venir permises par personne', 'Upcoming bookings allowed per person'],
    sMaxUpcomingHelp: ['Les administrateurs ne sont pas limités.', 'Admins are not limited.'],
    sLab: ['Laboratoire et inscription', 'Lab and sign-up'],
    sLabName: ['Nom du laboratoire', 'Lab name'],
    sAddress: ['Adresse', 'Address'],
    sContact: ['Contact (affiché sur la page et dans les courriels)', 'Contact (shown on the page and in emails)'],
    sReplyTo: ['Adresse de réponse aux courriels (facultatif)', 'Reply-to address for emails (optional)'],
    sDomains: ['Domaines permis pour l\'inscription (facultatif)', 'Email domains allowed to sign up (optional)'],
    sDomainsHelp: ['P. ex. uqam.ca, inrs.ca. Laissez vide pour accepter toutes les adresses.', 'E.g. uqam.ca, inrs.ca. Leave blank to accept any address.'],
    sSave: ['Enregistrer les réglages', 'Save settings'],
    sAdmins: ['Administrateurs', 'Administrators'],
    sAdminsHelp: ['Les administrateurs voient qui a réservé, peuvent ajouter, modifier ou annuler toute réservation et accèdent à cette page.',
      'Admins see who booked, can add, edit or cancel any booking, and can use this page.'],
    sRemove: ['Retirer', 'Remove'],
    sAddAdmin: ['Ajouter', 'Add'],
    sAskRemove: ['Retirer {0} des administrateurs?', 'Remove {0} from the admins?'],
    sLocked: ['(ne peut pas être retiré)', '(cannot be removed)'],
    sLog: ['Historique des changements', 'Change history'],
    sLogHelp: ['Les 25 derniers changements faits sur cette page (onglet Log de la feuille de calcul).', 'The last 25 changes made on this page (Log tab of the spreadsheet).'],
    sLogEmpty: ['Aucun changement pour l\'instant.', 'No changes yet.'],
    sWhen: ['Quand', 'When'], sWho: ['Qui', 'Who'], sWhat: ['Réglage', 'Setting'], sBefore: ['Avant', 'Before'], sAfter: ['Après', 'After'],
    noUpcoming: ['Aucune réservation à venir.', 'No upcoming bookings.'],
    otherLang: ['English', 'Français'],
    'Booked': ['Réservée', 'Booked'],
    'Awaiting confirmation': ['En attente de confirmation', 'Awaiting confirmation'],
    'Confirmed': ['Confirmée', 'Confirmed'],
    'Cancelled': ['Annulée', 'Cancelled']
  };

  var TOKEN = URL_TOKEN || store(STORE_KEY);
  var LANG = URL_LANG || store(LANG_KEY) || 'fr';
  var S = null;                         // session info from the server
  var state = { tab: 'schedule', date: null, day: null, ram: 'all' };

  function store(key, v) {
    try {
      if (v === undefined) return localStorage.getItem(key) || '';
      if (v === null) localStorage.removeItem(key); else localStorage.setItem(key, v);
    } catch (e) {}
    return '';
  }

  function t(key) {
    var pair = STR[key];
    var s = pair ? pair[LANG === 'en' ? 1 : 0] : key;
    for (var i = 1; i < arguments.length; i++) s = s.split('{' + (i - 1) + '}').join(String(arguments[i]));
    return s;
  }

  function setLang(l) {
    LANG = l === 'en' ? 'en' : 'fr';
    store(LANG_KEY, LANG);
    document.documentElement.lang = LANG;
  }

  // Calls a server function; the current language is always passed as the last argument.
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    args.push(LANG);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(e && e.message ? e.message : String(e));
      });
      r[fn].apply(r, args);
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(id) { return document.getElementById(id); }
  function note(id, text, kind) { var el = $(id); if (el) el.innerHTML = text ? '<div class="msg ' + kind + '">' + esc(text) + '</div>' : ''; }
  function langButton() { return '<button class="lang" id="lng" type="button" lang="' + (LANG === 'en' ? 'fr' : 'en') + '">' + t('otherLang') + '</button>'; }
  function wireLang(after) { $('lng').onclick = function () { setLang(LANG === 'en' ? 'fr' : 'en'); after(); }; }

  /* ---------- start ---------- */

  function start() {
    setLang(LANG);
    if (!TOKEN) { renderLogin(); return; }
    $('app').innerHTML = '<p class="muted" style="padding:16px">' + t('loading') + '</p>';
    call('getSession', TOKEN).then(function (s) {
      S = s;
      store(STORE_KEY, TOKEN);
      if (!state.date || !s.dates.some(function (d) { return d.value === state.date; })) state.date = s.dates.length ? s.dates[0].value : null;
      renderShell();
    }).catch(function (err) {
      store(STORE_KEY, null); TOKEN = '';
      renderLogin(err);
    });
  }

  /* ---------- sign in ---------- */

  function renderLogin(err) {
    var typed = $('em') ? $('em').value : '';
    $('app').innerHTML =
      '<div class="login"><div class="login-top"><h1>' + esc(LAB) + '</h1>' + langButton() + '</div>' +
      '<p class="muted">' + t('intro') + '</p>' +
      '<div id="lmsg">' + (err ? '<div class="msg err">' + esc(err) + '</div>' : '') + '</div>' +
      '<form id="lf"><input id="em" type="email" required placeholder="' + t('placeholder') + '" autocomplete="email" style="margin-bottom:10px">' +
      '<button class="btn primary" id="lb">' + t('sendLink') + '</button></form>' +
      '<p class="muted" style="margin:12px 0 0">' + t('spamNote') + '</p></div>';
    $('em').value = typed;
    wireLang(function () { renderLogin(); });
    $('lf').onsubmit = function (e) {
      e.preventDefault();
      $('lb').disabled = true;
      call('requestLoginLink', $('em').value)
        .then(function (m) { note('lmsg', m, 'ok'); })
        .catch(function (m) { note('lmsg', m, 'err'); })
        .then(function () { $('lb').disabled = false; });
    };
  }

  /* ---------- main layout ---------- */

  function renderShell() {
    var tabs = [['schedule', t('schedule')], ['mine', t('mine')]];
    if (S.isAdmin) { tabs.push(['all', t('all')]); tabs.push(['settings', t('settings')]); }
    if (!S.isAdmin && (state.tab === 'all' || state.tab === 'settings')) state.tab = 'schedule';
    $('app').innerHTML =
      '<header><h1>' + esc(S.labName) + '</h1>' +
      '<span class="muted">' + esc(S.email) + (S.isAdmin ? ' · ' + t('admin') : '') + ' · <a href="#" id="out">' + t('signOut') + '</a> ' + langButton() + '</span>' +
      (S.address || S.contact ? '<div class="muted" style="width:100%">' + esc(S.address) + (S.address && S.contact ? ' · ' : '') + esc(S.contact) + '</div>' : '') +
      '</header>' +
      '<main><div class="tabs">' + tabs.map(function (x) {
        return '<button class="tab' + (state.tab === x[0] ? ' on' : '') + '" data-tab="' + x[0] + '">' + x[1] + '</button>';
      }).join('') + '</div><div id="view"></div></main>';
    $('out').onclick = function (e) { e.preventDefault(); store(STORE_KEY, null); TOKEN = ''; renderLogin(); };

    Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) {
      b.onclick = function () { state.tab = b.getAttribute('data-tab'); renderShell(); };

    else if (state.tab === 'mine') renderList(false);
    else if (state.tab === 'settings') renderSettings();
    else renderList(true);
  }

  /* ---------- admin settings page ---------- */

  function renderSettings() {
    var v = $('view');
    v.innerHTML = '<div id="setmsg"></div><div id="sets"><p class="muted">' + t('loading') + '</p></div>';
    if (state.flash) { note('setmsg', state.flash.text, state.flash.kind); state.flash = null; }
    call('getSettings', TOKEN).then(drawSettings).catch(function (m) { note('setmsg', m, 'err'); });
  }

  // After a change: reload the session (rules, dates, admin list), come back to this tab and show the message
  function settingsDone(msg) { state.flash = { text: msg, kind: 'ok' }; state.tab = 'settings'; start(); }
  function settingsErr(msg) { note('setmsg', msg, 'err'); window.scrollTo(0, 0); }

  function drawSettings(G) {

    var field = function (id, label, value, opts) {

      return '<label class="f" for="' + id + '">' + label + (opts.help ? '<span class="sub">' + opts.help + '</span>' : '') + '</label>' +
        '<input type="' + (opts.type || 'text') + '" id="' + id + '" value="' + esc(value) + '"' + (opts.cls ? ' class="' + opts.cls + '"' : '') +
        (opts.min != null ? ' min="' + opts.min + '"' : '') + (opts.max != null ? ' max="' + opts.max + '"' : '') + '>' +
        (opts.unit ? '<span class="unit">' + opts.unit + '</span>' : '');

          (c.ram ? ' <span class="muted" style="font-weight:normal">' + esc(t('gb', c.ram)) + '</span>' : '') +
          (c.software ? '<span class="soft">' + esc(c.software) + '</span>' : '') + '</b>' +
          '<div class="tools">' +
          '<button class="btn sm" data-move="' + k + '" data-dir="-1" title="' + t('sUp') + '" aria-label="' + t('sUp') + '"' + (k === 0 ? ' disabled' : '') + '>↑</button>' +
          '<button class="btn sm" data-move="' + k + '" data-dir="1" title="' + t('sDown') + '" aria-label="' + t('sDown') + '"' + (k === G.computers.length - 1 ? ' disabled' : '') + '>↓</button>' +
          '<label class="sw" style="margin-left:8px"><input type="checkbox" data-avail="' + k + '"' + (c.available ? ' checked' : '') + '> ' + t('sBookable') + '</label></div></div>' +
          '<details><summary>' + t('sNotesEdit') + '</summary>' +
          '<label class="f">' + t('sName') + '<span class="sub">' + t('sNameHelp') + '</span></label><input type="text" maxlength="40" data-name="' + k + '" value="' + esc(c.name) + '">' +

          '<label class="f">' + t('sNoteEn') + '</label><input type="text" data-nen="' + k + '" value="' + esc(c.noteEn) + '">' +

      '<details style="margin-top:10px"><summary class="btn" style="display:inline-block">+ ' + t('sAddComp') + '</summary><div class="comp" style="margin-top:8px">' +
      '<label class="f">' + t('sName') + '</label><input type="text" maxlength="40" id="ncname" placeholder="Poste 10">' +

    // 2. Confirmation emails
    h += '<section class="panel"><h3>' + t('sEmails') + '</h3><p class="help">' + t('sEmailsHelp') + '</p>' +
      field('r1', t('sReminder1'), G.reminder1, { type: 'number', cls: 'short', min: 1, max: 336, unit: t('sHoursBefore') }) +
      field('r2', t('sReminder2'), G.reminder2, { type: 'number', cls: 'short', min: 1, max: 336, unit: t('sHoursBefore'), help: t('sReminder2Help') }) +
      field('rdl', t('sDeadline'), G.deadline, { type: 'number', cls: 'short', min: 0, max: 168, unit: t('sHoursBefore') }) +

      field('msl', t('sMaxSlots'), G.maxSlots, { type: 'number', cls: 'short', min: 1, unit: t('sSlotsUnit') + ' (' + G.slotMin + ' min)' }) +
      field('mup', t('sMaxUpcoming'), G.maxUpcoming, { type: 'number', cls: 'short', min: 1, max: 100, help: t('sMaxUpcomingHelp') }) +
      saveBtn + '</section>';

    // 4. Lab info and sign-up
    h += '<section class="panel"><h3>' + t('sLab') + '</h3>' +
      field('lname', t('sLabName'), G.labName) + field('laddr', t('sAddress'), G.address) + field('lcont', t('sContact'), G.contact) +
      field('lrep', t('sReplyTo'), G.replyTo, { type: 'email' }) + field('ldom', t('sDomains'), G.domains, { help: t('sDomainsHelp') }) +
      saveBtn + '</section>';

    // 5. Admins
    h += '<section class="panel"><h3>' + t('sAdmins') + '</h3><p class="help">' + t('sAdminsHelp') + '</p>' +
      G.admins.map(function (a) {
        return '<div class="arow"><span>' + esc(a.email) + '</span>' + (a.locked ? '<span class="muted">' + t('sLocked') + '</span>' :
          '<button class="btn danger" data-rmadmin="' + esc(a.email) + '">' + t('sRemove') + '</button>') + '</div>';
      }).join('') +
      '<form id="addadm" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input type="email" id="newadm" required placeholder="' + t('placeholder') + '" style="flex:1;min-width:200px">' +
      '<button class="btn primary">' + t('sAddAdmin') + '</button></form></section>';

    // 6. Change history
    h += '<section class="panel"><h3>' + t('sLog') + '</h3><p class="help">' + t('sLogHelp') + '</p>' +
      (G.log.length ? '<div class="wrap"><table class="logtbl"><thead><tr><th>' + t('sWhen') + '</th><th>' + t('sWho') + '</th><th>' + t('sWhat') + '</th><th>' + t('sBefore') + '</th><th>' + t('sAfter') + '</th></tr></thead><tbody>' +
        G.log.map(function (r) { return '<tr><td>' + esc(r.when) + '</td><td>' + esc(r.who) + '</td><td>' + esc(r.what) + '</td><td>' + esc(r.before) + '</td><td>' + esc(r.after) + '</td></tr>'; }).join('') +
        '</tbody></table></div>' : '<p class="muted">' + t('sLogEmpty') + '</p>') + '</section>';

    $('sets').innerHTML = h;

    // Computers: the "Bookable" switch saves right away; RAM and notes save with their button
    var q = function (attr, k) { return document.querySelector('[' + attr + '="' + k + '"]').value; };
    var compPayload = function (k) {
      return { available: document.querySelector('[data-avail="' + k + '"]').checked, name: q('data-name', k), ram: q('data-ram', k),
        software: q('data-soft', k), noteFr: q('data-nfr', k), noteEn: q('data-nen', k) };
    };
    var saveComp = function (k, el) {
      el.disabled = true;
      call('saveComputer', TOKEN, G.computers[k].name, compPayload(k)).then(settingsDone).catch(function (m) { el.disabled = false; settingsErr(m); });
    };
    $('sets').onchange = function (e) {
      var a = e.target.getAttribute('data-avail');
      if (a != null) saveComp(+a, e.target);
      // Opening-hours table: a closed day greys out its times
      var o = e.target.getAttribute('data-wopen');
      if (o != null) {
        document.querySelector('[data-wstart="' + o + '"]').disabled = !e.target.checked;
        document.querySelector('[data-wend="' + o + '"]').disabled = !e.target.checked;
        document.querySelector('[data-row="' + o + '"]').className = e.target.checked ? '' : 'closed';
      }

      var sc = e.target.closest('[data-savecomp]'), sr = e.target.closest('[data-saverules]'), rm = e.target.closest('[data-rmadmin]');
      var mv = e.target.closest('[data-move]'), dc = e.target.closest('[data-delcomp]');
      if (sc) saveComp(+sc.getAttribute('data-savecomp'), sc);
      if (mv) {
        mv.disabled = true;
        call('moveComputer', TOKEN, G.computers[+mv.getAttribute('data-move')].name, +mv.getAttribute('data-dir')).then(settingsDone).catch(settingsErr);
      }
      if (dc) {
        var cname = G.computers[+dc.getAttribute('data-delcomp')].name;
        if (!confirm(t('sAskDelete', cname))) return;
        call('deleteComputer', TOKEN, cname).then(settingsDone).catch(settingsErr);
      }
      if (e.target.id === 'ncadd') {
        e.target.disabled = true;
        call('addComputer', TOKEN, { name: $('ncname').value, ram: $('ncram').value, software: $('ncsoft').value, noteFr: $('ncnfr').value, noteEn: $('ncnen').value })
          .then(settingsDone).catch(function (m) { e.target.disabled = false; settingsErr(m); });
      }
      if (rm) {
        var who = rm.getAttribute('data-rmadmin');
        if (!confirm(t('sAskRemove', who))) return;
        call('removeAdmin', TOKEN, who).then(settingsDone).catch(settingsErr);
      }
      if (sr) {
        var week = [0, 1, 2, 3, 4, 5, 6].map(function (k) {
          return { open: document.querySelector('[data-wopen="' + k + '"]').checked,
            start: document.querySelector('[data-wstart="' + k + '"]').value, end: document.querySelector('[data-wend="' + k + '"]').value };
        });
        var r = { reminder1: $('r1').value, reminder2: $('r2').value, deadline: $('rdl').value, week: week,
          weeks: $('wk').value, maxSlots: $('msl').value, maxUpcoming: $('mup').value, labName: $('lname').value, address: $('laddr').value,
          contact: $('lcont').value, replyTo: $('lrep').value, domains: $('ldom').value };
        sr.disabled = true;
        call('saveRules', TOKEN, r).then(settingsDone).catch(function (m) { sr.disabled = false; settingsErr(m); });
      }
    };
    $('addadm').onsubmit = function (e) {
      e.preventDefault();
      call('addAdmin', TOKEN, $('newadm').value).then(settingsDone).catch(settingsErr);
    };
  }

  /* ---------- schedule grid ---------- */

  function renderSchedule() {
    var v = $('view');
    if (!S.dates.length) { v.innerHTML = '<p>' + t('noDays') + '</p>'; return; }
    if (!S.dates.some(function (d) { return d.value === state.date; })) state.date = S.dates[0].value;
    v.innerHTML =
      '<div id="smsg"></div>' +
      '<div id="cal" class="cal">' + (state.day ? '' : '<p class="muted">' + t('loading') + '</p>') + '</div>' +
      '<p class="muted" style="margin:-8px 0 14px">' + t('calHint') + '</p>' +
      '<h2 class="day-title" id="dtitle"></h2>' +
      '<div class="nav">' +
      '<select id="rsel"><option value="all">' + t('allComputers') + '</option></select>' +
      '<span class="legend"><span><i style="background:#fff"></i>' + t('legendFree') + '</span><span><i style="background:var(--blue-l)"></i>' + t('legendMine') +
      '</span><span><i style="background:var(--gray)"></i>' + t('legendTaken') + '</span><span><i style="background:#d9d9d9"></i>' + t('legendOff') +
      '</span><span><i class="blocked"></i>' + t('legendBlocked') + '</span></span>' +
      '</div>' +
      '<div class="wrap" id="grid"><p class="muted" style="padding:12px">' + t('loading') + '</p></div>' +
      '<div id="foot"></div>' +
      '<p class="muted rules">' + esc(S.rules) + '</p>';
    $('rsel').onchange = function () { state.ram = this.value; if (state.day) drawGrid(state.day); };
    $('cal').onclick = function (e) {
      var el = e.target.closest('[data-day]');
      if (!el || el.disabled) return;
      state.date = el.getAttribute('data-day');
      if (state.day) drawCalendar(state.day.calendar); // show the new selection right away
      $('grid').innerHTML = '<p class="muted" style="padding:12px">' + t('loading') + '</p>';
      loadDay();
    };
    if (state.day) drawCalendar(state.day.calendar);
    loadDay();
  }

  function loadDay() {
    var d = state.date;
    call('getDay', TOKEN, d).then(function (day) {
      if (d !== state.date) return;
      state.day = day;
      drawCalendar(day.calendar);
      drawGrid(day);
    }).catch(function (m) { note('smsg', m, 'err'); });
  }

  // The calendar: one row per week (the current week first), one button per open day
  function drawCalendar(cal) {
    var el = $('cal');
    if (!el || !cal) return;
    el.style.gridTemplateColumns = 'repeat(' + cal.heads.length + ', minmax(0, 1fr))';
    var h = cal.heads.map(function (d) { return '<div class="dh">' + esc(d) + '</div>'; }).join('');
    cal.weeks.forEach(function (week) {
      week.forEach(function (d) {
        var cls = 'cday ' + d.st + (d.value === state.date ? ' sel' : '');
        var body = '<span class="n">' + d.day + '</span> <span class="m">' + esc(d.mon) + '</span>';
        if (d.st === 'open') {
          body += '<span class="cnt">' + esc(t('calFree', d.free)) + '</span>' +
            '<span class="bar"><b style="width:' + Math.round(100 * d.free / Math.max(1, d.total)) + '%"></b></span>';
        } else if (d.st === 'full') {
          body += '<span class="cnt">' + t('calFull') + '</span>';
        } else {
          body += '<span class="cnt">&nbsp;</span>';
        }
        if (d.mine) body += '<span class="dot" title="' + esc(t('calMine')) + '"></span>';
        h += '<button type="button" class="' + cls + '" data-day="' + d.value + '"' + (d.st === 'past' ? ' disabled' : '') + '>' + body + '</button>';
      });
    });
    el.innerHTML = h;
  }

  function drawGrid(day) {
    if (!day.computers.length) { $('grid').innerHTML = '<p style="padding:12px">' + t('noComputers') + '</p>'; return; }

    // Filter options, built from the computers list: by RAM ("r:64") and by software ("s:SPSS")
    var softList = function (c) { return c.software ? c.software.split(/\s*,\s*/) : []; };
    var rams = [], softs = [];
    day.computers.forEach(function (c) {
      if (c.ram && rams.indexOf(c.ram) < 0) rams.push(c.ram);
      softList(c).forEach(function (s) { if (softs.indexOf(s) < 0) softs.push(s); });
    });
    rams.sort(function (a, b) { return Number(b) - Number(a); });
    softs.sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; });
    var filters = [['all', t('allComputers')]];
    if (rams.length > 1) rams.forEach(function (r) { filters.push(['r:' + r, t('ramOnly', r)]); });
    softs.forEach(function (s) { filters.push(['s:' + s, t('withSoftware', s)]); });
    if (!filters.some(function (f) { return f[0] === state.ram; })) state.ram = 'all';
    var rsel = $('rsel');
    if (rsel) {
      rsel.innerHTML = filters.map(function (f) {
        return '<option value="' + esc(f[0]) + '"' + (state.ram === f[0] ? ' selected' : '') + '>' + esc(f[1]) + '</option>';
      }).join('');
      rsel.style.display = filters.length > 1 ? '' : 'none';
    }
    var shown = function (c) {
      if (state.ram === 'all') return true;
      if (state.ram.slice(0, 2) === 'r:') return c.ram === state.ram.slice(2);
      return softList(c).indexOf(state.ram.slice(2)) >= 0;
    };
    var cols = [];
    day.computers.forEach(function (c, j) { if (shown(c)) cols.push(j); });

    $('dtitle').textContent = day.dateLabel;

    // Column headers: number/name (+ * when the computer has a note) and RAM; unavailable ones greyed out
    var h = '<table><thead><tr><th class="time">' + t('timeCol') + '</th>' + cols.map(function (j) {
      var c = day.computers[j];
      var tip = !c.available ? t('offTitle') : c.note;
      return '<th' + (c.available ? '' : ' class="offh"') + ' title="' + esc(tip) + '">' + esc(c.name) + (c.note ? '*' : '') +
        (c.ram ? '<br><span style="font-weight:normal">' + esc(t('gb', c.ram)) + '</span>' : '') +
        (c.software ? '<span class="swh">' + esc(c.software) + '</span>' : '') + '</th>';
    }).join('') + '</tr></thead><tbody>';
    day.slots.forEach(function (sl, i) {
      h += '<tr><td class="time">' + esc(sl.startLabel) + '</td>';
      cols.forEach(function (j) {
        var cell = day.cells[i][j];
        var cls = cell.st, txt = '&nbsp;';
        if (cell.st === 'mine') txt = t('you') + (cell.status === 'Confirmed' ? ' ✓' : '');
        else if (cell.st === 'taken') {
          txt = cell.who ? esc(cell.who.split('@')[0]) : t('booked');
          if (cell.id) cls += ' admin';
        } else if (cell.st === 'blocked') {
          txt = esc(cell.note || t('legendBlocked'));
          if (cell.id) cls += ' admin';
        } else if (cell.st === 'off' && S.isAdmin) cls += ' admin'; // admins can still book unavailable computers
        h += '<td><span class="c ' + cls + '" data-i="' + i + '" data-j="' + j + '">' + txt + '</span></td>';
      });
      h += '</tr>';
    });
    $('grid').innerHTML = h + '</tbody></table>';

    // Footnotes for computers with a note (e.g. Poste Antoine)
    $('foot').innerHTML = cols.filter(function (j) { return day.computers[j].note; }).map(function (j) {
      var c = day.computers[j];
      return '<p class="foot">* <b>' + esc(c.name) + '</b>' + (LANG === 'en' ? ': ' : ' : ') + esc(c.note) + '</p>';
    }).join('');

    $('grid').onclick = function (e) {
      var el = e.target.closest('[data-i]');
      if (!el) return;
      var i = +el.getAttribute('data-i'), j = +el.getAttribute('data-j');
      var cell = state.day.cells[i][j];
      if (cell.id) bookingDialog(cell, state.day.computers[j].name);
      else if (S.isAdmin && (cell.st === 'free' || cell.st === 'off' || cell.st === 'past')) {
        adminDialog({ computer: state.day.computers[j].name, date: state.date, startIdx: i, len: Math.max(1, cell.run || 1), mode: 'self' });
      } else if (cell.st === 'free') bookDialog(i, j);
    };
  }

  function bookDialog(i, j) {
    var day = state.day, cell = day.cells[i][j], comp = day.computers[j].name;
    var ram = day.computers[j].ram;
    var compNote = day.computers[j].note;
    var opts = '';
    for (var n = 1; n <= cell.run; n++) {
      opts += '<option value="' + n + '">' + esc(day.slots[i + n - 1].endLabel) + '</option>';
    }
    modal('<h3>' + esc(t('bookTitle', comp + (compNote ? '*' : ''))) + (ram ? ' <span class="muted" style="font-weight:normal">' + esc(t('ramParen', ram)) + '</span>' : '') + '</h3>' +
      (compNote ? '<p class="warn">* ' + esc(compNote) + '</p>' : '') +
      (day.computers[j].software ? '<p class="muted" style="margin:0">' + esc(t('softwareLine', day.computers[j].software)) + '</p>' : '') +
      '<p>' + esc(day.dateLabel) + '<br>' + t('fromUntil', esc(day.slots[i].startLabel), '<select id="dur">' + opts + '</select>') + '</p>' +
      '<div id="mmsg"></div>' +
      '<div class="row"><button class="btn" data-close>' + t('back') + '</button><button class="btn primary" id="go">' + t('book') + '</button></div>');
    $('go').onclick = function () {
      $('go').disabled = true;
      call('createBooking', TOKEN, comp, state.date, i, +$('dur').value).then(function (m) {
        closeModal(); note('smsg', m, 'ok'); loadDay();
      }).catch(function (m) { note('mmsg', m, 'err'); $('go').disabled = false; loadDay(); });
    };
  }

  function bookingDialog(cell, comp) {
    var mine = cell.st === 'mine';
    var who = cell.st === 'blocked' ? t('legendBlocked') + (cell.note ? ' : ' + cell.note : '') : (cell.who && !mine ? cell.who : '');
    modal('<h3>' + esc(comp) + '</h3>' +
      '<p>' + esc(cell.when) + '<br><span class="muted">' + esc(t(cell.status)) + (who ? ' · ' + esc(who) : '') + '</span>' +
      (cell.note && cell.st !== 'blocked' ? '<br><span class="muted">' + esc(cell.note) + '</span>' : '') + '</p>' +
      '<div id="mmsg"></div>' +
      '<div class="row"><button class="btn" data-close>' + t('back') + '</button>' +
      (mine && cell.status !== 'Confirmed' ? '<button class="btn primary" id="conf">' + t('confirm') + '</button>' : '') +
      (S.isAdmin && cell.edit ? '<button class="btn" id="edt">' + t('edit') + '</button>' : '') +
      '<button class="btn danger" id="canc">' + t('cancelBooking') + '</button></div>');
    if ($('conf')) $('conf').onclick = function () { act('confirmBooking', cell.id); };
    if ($('edt')) $('edt').onclick = function () { adminDialog(editPrefill(cell.edit)); };
    $('canc').onclick = function () {
      if (!mine && !confirm(cell.who ? t('askAdminCancel', cell.who) : t('askCancel'))) return;
      act('cancelBooking', cell.id);
    };
  }

  /* ---------- admin: add or edit any booking, or block computers ---------- */

  // Turns a booking's edit info (from the server) into the dialog's starting values
  function editPrefill(e) {
    var mode = !e.email ? 'block' : (e.email === S.email ? 'self' : 'other');
    return { id: e.id, computer: e.computer, date: e.date, startIdx: e.startIdx, len: e.len, mode: mode, email: e.email, note: e.note };
  }

  function adminDialog(pre) {
    var A = S.adminData, isEdit = !!pre.id;
    var opt = function (v, label, sel) { return '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(label) + '</option>'; };
    var comps = A.computers.map(function (c) {
      return opt(c.name, c.name + (c.ram ? ' – ' + t('gb', c.ram) : '') + (c.available ? '' : ' (' + t('offShort') + ')'), c.name === pre.computer);
    }).join('') + (isEdit ? '' : opt('*', t('everyComputer'), false));
    // Slot boundaries of a date: each weekday has its own hours (0 = Monday)
    var slotsOf = function (dateStr) {
      var p = String(dateStr || '').split('-');
      var d = p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : new Date();
      return A.slotsByDow[(d.getDay() + 6) % 7] || A.slotsByDow[0];
    };
    // Fills the From / Until lists for the chosen date, keeping the chosen times where they still exist
    var fillTimes = function (dateStr, from, to) {
      var sl = slotsOf(dateStr), n = sl.length - 1, starts = '', ends = '';
      from = Math.min(Math.max(0, from), n - 1);
      to = Math.min(Math.max(from + 1, to), n);
      for (var i = 0; i < n; i++) starts += opt(i, sl[i], i === from);
      for (var k = 1; k <= n; k++) ends += opt(k, sl[k], k === to);
      $('afrom').innerHTML = starts;
      $('ato').innerHTML = ends;
    };
    modal('<h3>' + t(isEdit ? 'editTitle' : 'addTitle') + '</h3><div class="form">' +
      '<label>' + t('fDate') + '</label><input type="date" id="adate" min="' + A.today + '" value="' + esc(pre.date) + '">' +
      '<label>' + t('fComputer') + '</label><select id="acomp">' + comps + '</select>' +
      '<div class="two"><div><label>' + t('fFrom') + '</label><select id="afrom"></select></div>' +
      '<div><label>' + t('fTo') + '</label><select id="ato"></select></div></div>' +
      '<label>' + t('fFor') + '</label><select id="amode">' + opt('self', t('forSelf') + ' (' + S.email + ')', pre.mode === 'self') +
      opt('other', t('forOther'), pre.mode === 'other') + opt('block', t('forBlock'), pre.mode === 'block') + '</select>' +
      '<div id="aemailbox"><label>' + t('fEmail') + '</label><input type="email" id="aemail" value="' + esc(pre.mode === 'other' ? pre.email : '') + '"></div>' +
      '<label id="anotelbl"></label><input type="text" id="anote" maxlength="200" value="' + esc(pre.note || '') + '">' +
      '<label class="chk" id="anotifybox"><input type="checkbox" id="anotify" checked> ' + t('fNotify') + '</label>' +
      '<p class="muted" style="margin:10px 0 0">' + t('adminBookHint') + '</p>' +
      '</div><div id="mmsg"></div>' +
      '<div class="row"><button class="btn" data-close>' + t('back') + '</button><button class="btn primary" id="asave">' + t('save') + '</button></div>');

    // Show only the fields that apply to the chosen "For"
    function sync() {
      var m = $('amode').value;
      $('aemailbox').style.display = m === 'other' ? '' : 'none';
      $('anotifybox').style.display = m === 'other' ? '' : 'none';
      $('anotelbl').textContent = m === 'block' ? t('fLabel') : t('fNote');
      var all = $('acomp').querySelector('option[value="*"]');
      if (all) { all.disabled = m !== 'block'; if (m !== 'block' && $('acomp').value === '*') $('acomp').selectedIndex = 0; }
    }
    $('amode').onchange = sync;
    sync();
    fillTimes(pre.date, pre.startIdx, pre.startIdx + pre.len);
    // Another date may have other hours: rebuild the time lists, keeping the same times when possible
    $('adate').onchange = function () {
      var old = slotsOf(pre.date), from = old[+$('afrom').value], to = old[+$('ato').value];
      var sl = slotsOf($('adate').value);
      var fi = sl.indexOf(from), ti = sl.indexOf(to);
      fillTimes($('adate').value, fi < 0 ? 0 : fi, ti < 0 ? (fi < 0 ? 1 : fi + 1) : ti);
      pre.date = $('adate').value;
    };

    $('asave').onclick = function () {
      var from = +$('afrom').value, to = +$('ato').value;
      if (to <= from) { note('mmsg', t('endBeforeStart'), 'err'); return; }
      var m = $('amode').value;
      var p = { id: pre.id || '', computer: $('acomp').value, date: $('adate').value, startIdx: from, len: to - from,
        mode: m, email: $('aemail').value, note: $('anote').value, notify: m === 'other' && $('anotify').checked };
      $('asave').disabled = true;
      call('adminSaveBooking', TOKEN, p).then(function (msg) {
        closeModal();
        if (state.tab === 'schedule') { note('smsg', msg, 'ok'); loadDay(); }
        else { renderShell(); note('lmsg2', msg, 'ok'); }
      }).catch(function (msg) { note('mmsg', msg, 'err'); $('asave').disabled = false; });
    };
  }

  function act(fn, id) {
    call(fn, TOKEN, id).then(function (m) {
      closeModal();
      if (state.tab === 'schedule') { note('smsg', m, 'ok'); loadDay(); }
      else renderShell();
    }).catch(function (m) { note('mmsg', m, 'err'); });
  }

  /* ---------- lists ---------- */

  function renderList(admin) {
    var v = $('view');
    v.innerHTML = '<div id="lmsg2"></div>' +
      (admin ? '<p><button class="btn primary" id="addb">' + t('addBooking') + '</button></p>' : '') +
      '<div id="list"><p class="muted">' + t('loading') + '</p></div>' +
      (admin ? '<p class="muted">' + t('adminNote') + '</p>' : '');
    if (admin) $('addb').onclick = function () {
      var first = S.adminData.computers.filter(function (c) { return c.available; })[0] || S.adminData.computers[0];
      adminDialog({ computer: first ? first.name : '', date: state.date || S.adminData.today, startIdx: 0, len: 1, mode: 'other' });
    };
    call(admin ? 'getAllUpcoming' : 'getMyBookings', TOKEN).then(function (list) {
      $('list').innerHTML = list.length ? list.map(function (b, idx) {
        var badge = b.status === 'Awaiting confirmation' ? 'Awaiting' : b.status;
        var who = b.email ? b.email : t('legendBlocked') + (b.note ? ' : ' + b.note : '');
        return '<div class="card"><div><b>' + esc(b.computer) + '</b> · ' + esc(b.when) +
          (admin ? '<br><span class="muted">' + esc(who) + (b.email && b.note ? ' · ' + esc(b.note) : '') + '</span>' : '') +
          '<br><span class="badge ' + badge + '">' + esc(t(b.status)) + '</span></div>' +
          '<div class="actions">' +
          (!admin && b.status !== 'Confirmed' ? '<button class="btn primary" data-confirm="' + b.id + '">' + t('confirm') + '</button>' : '') +
          (admin && b.id ? '<button class="btn" data-edit="' + idx + '">' + t('edit') + '</button>' : '') +
          '<button class="btn danger" data-cancel="' + b.id + '">' + t('cancel') + '</button></div></div>';
      }).join('') : '<p class="muted">' + t('noUpcoming') + '</p>';
      $('list').onclick = function (e) {
        var ed = e.target.closest('[data-edit]');
        if (ed) { adminDialog(editPrefill(list[+ed.getAttribute('data-edit')].edit)); return; }
        var c = e.target.closest('[data-confirm]'), x = e.target.closest('[data-cancel]');
        if (c) call('confirmBooking', TOKEN, c.getAttribute('data-confirm')).then(function () { renderShell(); }).catch(function (m) { note('lmsg2', m, 'err'); });
        if (x && confirm(t('askCancel'))) call('cancelBooking', TOKEN, x.getAttribute('data-cancel')).then(function () { renderShell(); }).catch(function (m) { note('lmsg2', m, 'err'); });
      };
    }).catch(function (m) { note('lmsg2', m, 'err'); });
  }

  /* ---------- modal ---------- */

  function modal(html) {
    closeModal();
    var bg = document.createElement('div');
    bg.className = 'modal-bg'; bg.id = 'modal';
    bg.innerHTML = '<div class="modal">' + html + '</div>';
    bg.onclick = function (e) { if (e.target === bg || e.target.hasAttribute('data-close')) closeModal(); };
    document.body.appendChild(bg);
  }
  function closeModal() { var m = $('modal'); if (m) m.remove(); }

  start();
</script>
</body>
</html>
